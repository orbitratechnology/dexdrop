[package]
name = "dexdrop-app"
description = "The DexDrop app: a Native Shell (NSH) Rust application."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "dexdrop_app"

[[bin]]
name = "dexdrop-app"
path = "src/main.rs"

[dependencies]
nsh-core = { version = "=0.7.0", features = ["svg"] }
nsh-base = "=0.7.0"
# NSH's official modules (an nshm): `camera` scans another device's QR code
# (FR-024). Its feature's [package.metadata.nsh] adds the camera's usage text
# (iOS) and the camera apps' <queries> (Android) to the packages.
nsh-extra = { version = "=0.7.0", features = ["camera"] }
dexdrop-core = { path = "../crates/dexdrop-core" }
log = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
env_logger = "0.11"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
dexdrop-net = { path = "../crates/dexdrop-net" }

[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-linux = { version = "=0.7.0", default-features = false, features = ["svg"] }

# Android's runtime permissions (`nsh::permissions`): the media browser's
# READ_MEDIA_* (src/android.rs).
[target.'cfg(target_os = "android")'.dependencies]
nsh-platform-android = { version = "=0.7.0", default-features = false }

# The photo library as Send's media browser's provider (PhotoKit).
[target.'cfg(target_os = "ios")'.dependencies]
dexdrop-photos = { path = "../crates/dexdrop-photos" }

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos = { version = "=0.7.0", default-features = false, features = ["svg"] }

[target.'cfg(target_os = "windows")'.dependencies]
nsh-platform-windows = { version = "=0.7.0", default-features = false, features = ["svg", "media"] }

[dev-dependencies]
nsh-engine = "=0.7.0"
nsh-testing = "=0.7.0"
tempfile = "3"
# Pictures of QR codes for the camera's fake (tests/camera.rs).
image = { version = "0.25", default-features = false, features = ["png"] }
# Pictures of headless screens (tests/common/shot.rs): what NSH's headless
# engine laid out, drawn as SVG and rasterized (the engine draws nothing).
resvg = "0.48"
