name: CI

on:
  push:
  pull_request:
  # "Run workflow" builds what is asked: one platform's package (with its
  # checks, or without for just the artifact), or everything.
  workflow_dispatch:
    inputs:
      platforms:
        description: "What to run (auto: what the changes need)"
        type: choice
        default: auto
        options: [auto, all, android, apple, windows, linux, web, engine, app]
      checks:
        description: "Run the tests and device checks (off: build the package only)"
        type: boolean
        default: true

# A newer push to the same branch cancels the run still going for the older
# commit, so packaging is not repeated for outdated commits.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NSH_VERSION: v0.7.1
  CARGO_TERM_COLOR: always

jobs:
  # Which jobs this run needs (scripts/ci-plan.sh): everything on main and
  # pull requests; else what was asked (Run workflow, `[ci android]` in the
  # commit message) or what the changed files touch. Its summary says why.
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    outputs:
      engine: ${{ steps.plan.outputs.engine }}
      app: ${{ steps.plan.outputs.app }}
      linux: ${{ steps.plan.outputs.linux }}
      web: ${{ steps.plan.outputs.web }}
      android: ${{ steps.plan.outputs.android }}
      apple: ${{ steps.plan.outputs.apple }}
      windows: ${{ steps.plan.outputs.windows }}
      checks: ${{ steps.plan.outputs.checks }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: scripts/ci-plan.sh --self-test
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          MESSAGE: ${{ github.event.head_commit.message }}
          PLATFORMS: ${{ inputs.platforms }}
          CHECKS: ${{ inputs.checks }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch -q origin main || true
          # The commit of this branch's last successful run: the plan's base.
          LAST_GREEN=$(gh api -X GET "repos/${{ github.repository }}/actions/workflows/ci.yml/runs" \
            -f branch="${{ github.ref_name }}" -f status=success -f per_page=1 \
            --jq '.workflow_runs[0].head_sha // empty' 2>/dev/null || true)
          export LAST_GREEN
          scripts/ci-plan.sh 2> reason.txt | tee -a "$GITHUB_OUTPUT" > plan.txt
          { echo "### Plan"; echo; sed 's/^reason=//' reason.txt; echo; echo '```'; cat plan.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  # The engine and protocol on every desktop OS: no UI toolkit needed.
  engine:
    name: Engine tests (${{ matrix.os }})
    needs: plan
    if: needs.plan.outputs.engine == 'true' && needs.plan.outputs.checks == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
        if: runner.os == 'Linux'
      - run: cargo clippy -p dexdrop-core -p dexdrop-net -p dexdrop-cli --all-targets --features dexdrop-net/test-relay -- -D warnings
      - run: cargo test -p dexdrop-core -p dexdrop-net -p dexdrop-cli --features dexdrop-net/test-relay
        env:
          # Windows' Credential Manager works on CI: the key must go there.
          DEXDROP_EXPECT_SYSTEM_KEYSTORE: ${{ runner.os == 'Windows' && '1' || '' }}
      - run: cargo run --release -p dexdrop-cli -- bench --mb 512
      # One send to three receivers at once (ADR-003).
      - run: cargo run --release -p dexdrop-cli -- bench --mb 256 --to 3
      - name: Transport benchmark (TCP + TLS against QUIC)
        if: runner.os == 'Linux'
        run: cargo run --release -p dexdrop-bench -- 512 3

  # The NSH app's headless UI tests (GTK 4 is needed to link the desktop crate).
  app-tests:
    name: App UI tests (Linux)
    needs: plan
    if: needs.plan.outputs.app == 'true' && needs.plan.outputs.checks == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # GTK 4 only: since NSH 0.7.1 the Linux backend loads GStreamer at run
      # time, so building needs none of its development files.
      - run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev clang
      # NSH's verification loop for a Rust app (format, lint every target,
      # then the headless UI): the app and the PhotoKit crate are checked
      # here, as the engine's crates are in their job.
      - run: cargo fmt --all --check
      - run: cargo clippy -p dexdrop-app -p dexdrop-photos --all-targets -- -D warnings
      - run: cargo test -p dexdrop-app

  package-linux:
    name: Package Linux
    needs: plan
    if: needs.plan.outputs.linux == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # GStreamer's development files stay here: `nsh package` links
      # GStreamer into the runner of an app that plays video (the viewer's
      # <Video>, NSH 0.7.1).
      - run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev clang libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev xvfb imagemagick
      - name: Install NSH
        run: |
          curl -fsSL https://nsh.dev/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: nsh -V
      # NSH's check for a Rust app: cargo check --all-targets, then the e2e
      # test's TypeScript against NSH's types (app/tsconfig.json).
      - run: cd app && nsh check
      - run: nsh package app --target linux --build ${{ github.run_number }} -o dist/linux
      - run: cargo build --release -p dexdrop-cli
      - uses: actions/upload-artifact@v4
        with:
          name: dexdrop-linux-x86_64
          path: |
            dist/linux/*.tar.gz
            target/release/dexdrop
      # The packaged app, started for real (on a virtual display): discovered
      # by the CLI, receives a file and a folder byte-identical.
      # The real GTK app driven by NSH's test runner (app/e2e): the same
      # selectors as the headless tests, through the platform's input.
      - name: App e2e (nsh test, Linux)
        if: needs.plan.outputs.checks == 'true'
        env:
          GSK_RENDERER: cairo
          CARGO_PROFILE_DEV_DEBUG: "0"
        run: |
          sudo apt-get install -y libsoup-3.0-dev libwebkitgtk-6.0-dev
          mkdir -p dist/desktop-check
          rm -rf app/e2e-shots
          cd app && xvfb-run -a -s "-screen 0 1280x800x24" nsh test e2e/app.test.ts --target linux --junit ../dist/desktop-check/e2e-linux.xml && status=0 || status=$?
          mkdir -p ../dist/desktop-check/shots-linux && mv e2e-shots/* ../dist/desktop-check/shots-linux/ 2>/dev/null || true
          exit $status
      - name: Desktop app check
        if: needs.plan.outputs.checks == 'true'
        env:
          GSK_RENDERER: cairo
        run: >
          xvfb-run -a -s "-screen 0 1280x800x24"
          python3 scripts/desktop-check.py --require-discovery
          --app dist/linux/DexDrop/DexDrop --cli target/release/dexdrop --out dist/desktop-check
      - uses: actions/upload-artifact@v4
        if: always() && needs.plan.outputs.checks == 'true'
        with:
          name: desktop-check-linux
          path: dist/desktop-check

  package-web:
    name: Package web preview
    needs: plan
    if: needs.plan.outputs.web == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # The CLI describes the crate with a native helper, which links GTK;
      # C code built for WebAssembly needs clang and llvm-ar. No GStreamer
      # (NSH 0.7.1 loads it at run time).
      - run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev clang llvm
      - name: Install NSH
        run: |
          curl -fsSL https://nsh.dev/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: nsh package app --target web --build ${{ github.run_number }} -o dist/web
      - uses: actions/upload-artifact@v4
        with:
          name: dexdrop-web
          path: dist/web

  package-android:
    name: Package Android
    needs: plan
    if: needs.plan.outputs.android == 'true'
    runs-on: ubuntu-24.04
    env:
      NDK_VERSION: 27.2.12479018
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # The CLI's native helper links GTK; GStreamer is not needed since NSH
      # 0.7.1.
      - run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev clang
      # The runner image ships the Android SDK; add what NSH packages with.
      - run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.1" "platform-tools" "ndk;${NDK_VERSION}"
      - run: echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - name: Install NSH
        run: |
          curl -fsSL https://nsh.dev/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: nsh component add android
      # Signed with the project's release keystore when the repository has
      # one (secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEY_ALIAS and
      # NSH_KEYSTORE_PASSWORD; docs/PACKAGING.md, "Signing"), so each build installs
      # over the last; else with the debug key NSH creates, new on every
      # runner. The build number (versionCode) is the run's, growing with
      # every build. x86_64 is for emulators (the check below) and x86
      # Chromebooks. The manifest's permissions and queries, the adaptive
      # icon and the Java bridges come from nsh.json and dexdrop-net's
      # Cargo.toml ([package.metadata.nsh]).
      - name: Package the APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          NSH_KEYSTORE_PASSWORD: ${{ secrets.NSH_KEYSTORE_PASSWORD }}
        run: |
          signing=()
          if [ -n "$KEYSTORE_BASE64" ]; then
            export ANDROID_KEYSTORE="$RUNNER_TEMP/release.jks"
            echo "$KEYSTORE_BASE64" | base64 -d > "$ANDROID_KEYSTORE"
            signing=(--keystore "$ANDROID_KEYSTORE" --key-alias "$ANDROID_KEY_ALIAS")
          fi
          nsh package app --target android --abi arm64-v8a,armeabi-v7a,x86_64 --build ${{ github.run_number }} "${signing[@]}" -o dist/android
          rm -f "$RUNNER_TEMP/release.jks"
      # What the package must declare, read back from the APK.
      - name: Check the APK's manifest and icon
        run: |
          apk=$(ls dist/android/*.apk | head -1)
          aapt2=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/aapt2
          manifest=$("$aapt2" dump xmltree --file AndroidManifest.xml "$apk")
          for want in REQUEST_INSTALL_PACKAGES android.intent.action.MAIN android.intent.action.SEND_MULTIPLE android.media.action.IMAGE_CAPTURE FOREGROUND_SERVICE_DATA_SYNC dev.dexdrop.TransferService; do
            grep -q "$want" <<<"$manifest" || { echo "::error::the manifest lacks $want"; exit 1; }
          done
          # The media browser's granular permissions (ADR-009): photos,
          # videos and audio, Android 14's partial access; never all files.
          for want in READ_MEDIA_IMAGES READ_MEDIA_VIDEO READ_MEDIA_AUDIO READ_MEDIA_VISUAL_USER_SELECTED dev.dexdrop.PickerActivity; do
            grep -q "$want" <<<"$manifest" || { echo "::error::the manifest lacks $want"; exit 1; }
          done
          ! grep -q 'android.permission.MANAGE_EXTERNAL_STORAGE"' <<<"$manifest" || { echo "::error::the manifest asks for MANAGE_EXTERNAL_STORAGE"; exit 1; }
          "$aapt2" dump resources "$apk" | grep -q "ic_launcher" || { echo "::error::no launcher icon"; exit 1; }
          unzip -o -q "$apk" 'classes*.dex' -d "$RUNNER_TEMP/dex"
          for class in NsdBridge TransferService AssetsBridge PickerActivity; do
            grep -qa "Ldev/dexdrop/$class;" "$RUNNER_TEMP"/dex/classes*.dex || { echo "::error::dev.dexdrop.$class (dexdrop-net's nsd.dex) is not in the APK"; exit 1; }
          done
      - uses: actions/upload-artifact@v4
        with:
          name: dexdrop-android
          path: dist/android/*.apk
      # The CLI for the emulator: the check runs it inside, next to the app.
      # The checks below: skipped for a build-only run.
      - name: Build the CLI for the emulator
        if: needs.plan.outputs.checks == 'true'
        run: |
          bin="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER="$bin/x86_64-linux-android26-clang"
          export CC_x86_64_linux_android="$bin/x86_64-linux-android26-clang"
          export AR_x86_64_linux_android="$bin/llvm-ar"
          cargo build --release -p dexdrop-cli --target x86_64-linux-android
      - name: Enable KVM for the emulator
        if: needs.plan.outputs.checks == 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-node@v4
        if: needs.plan.outputs.checks == 'true'
        with:
          node-version: "22"
      - run: npm install -g agent-device@latest && sudo apt-get install -y zbar-tools
        if: needs.plan.outputs.checks == 'true'
      # NSH's runner first (app/e2e on the emulator), then what crosses
      # apps (system pickers, the CLI as the other device) with agent-device.
      - name: Android emulator checks (nsh test, then agent-device)
        if: needs.plan.outputs.checks == 'true'
        timeout-minutes: 50
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          # Room for DexDrop and NSH's test host side by side (the default
          # data partition refused the second: INSUFFICIENT_STORAGE).
          disk-size: 6G
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash scripts/android-checks.sh "$(ls dist/android/*.apk | head -1)" target/x86_64-linux-android/release/dexdrop dist/android-check
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && needs.plan.outputs.checks == 'true' }}
        with:
          name: android-check
          path: dist/android-check

  package-windows:
    name: Package Windows
    needs: plan
    if: needs.plan.outputs.windows == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install NSH
        shell: pwsh
        run: |
          irm https://nsh.dev/install.ps1 | iex
          "$env:LOCALAPPDATA\nsh\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
      - run: nsh package app --target windows --build ${{ github.run_number }} -o dist/windows
      - run: cargo build --release -p dexdrop-cli
      - uses: actions/upload-artifact@v4
        with:
          name: dexdrop-windows-x86_64
          path: |
            dist/windows
            target/release/dexdrop.exe
      - name: App e2e (nsh test, Windows)
        if: needs.plan.outputs.checks == 'true'
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
        shell: bash
        run: |
          mkdir -p dist/desktop-check
          rm -rf app/e2e-shots
          cd app && nsh test e2e/app.test.ts --target windows --junit ../dist/desktop-check/e2e-windows.xml && status=0 || status=$?
          mkdir -p ../dist/desktop-check/shots-windows && mv e2e-shots/* ../dist/desktop-check/shots-windows/ 2>/dev/null || true
          exit $status
      - name: Desktop app check
        if: needs.plan.outputs.checks == 'true'
        run: python scripts/desktop-check.py --app dist/windows/DexDrop/DexDrop.exe --cli target/release/dexdrop.exe --out dist/desktop-check
      - uses: actions/upload-artifact@v4
        if: always() && needs.plan.outputs.checks == 'true'
        with:
          name: desktop-check-windows
          path: dist/desktop-check

  # macOS app and the iOS simulator build: no paid Apple Developer Program
  # membership is needed for either (PRD 1.1, 8.2).
  package-apple:
    name: Package macOS and iOS simulator
    needs: plan
    if: needs.plan.outputs.apple == 'true'
    runs-on: macos-15
    permissions:
      # The simulator build goes to the native-sim-build release.
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim,aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
      # Xcode 26 (the iOS 26 SDK): NSH links the app with the Xcode it
      # finds, and an app built with an older SDK runs on iOS 26 in
      # compatibility mode, without Liquid Glass (the tab bar, headers).
      - name: Use Xcode 26
        run: |
          x=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$x" ]; then
            sudo xcode-select -s "$x/Contents/Developer"
          else
            echo "::warning::no Xcode 26 on this runner: the iOS app keeps the look from before iOS 26"
          fi
          xcodebuild -version
      - name: Install NSH
        run: |
          curl -fsSL https://nsh.dev/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: nsh package app --target macos --build ${{ github.run_number }} -o dist/macos
      - run: nsh package app --target ios-simulator --build ${{ github.run_number }} -o dist/ios-simulator
      - run: cargo build --release -p dexdrop-cli
      - uses: actions/upload-artifact@v4
        with:
          name: dexdrop-macos-arm64-unsigned
          path: |
            dist/macos
            target/release/dexdrop
      - uses: actions/upload-artifact@v4
        with:
          name: dexdrop-ios-simulator
          path: dist/ios-simulator
      # The simulator build that native-sim sessions install (the native-sim
      # workflow on main, mode=app, app_release_asset=DexDrop.app.tar.gz):
      # `DexDrop.app` in a .tar.gz on the native-sim-build release, replaced
      # on every push.
      # A convenience for native-sim sessions, not a check: GitHub's API
      # failing here (an HTTP 503 in run 92) must not skip the checks below.
      - name: Publish the simulator build for native-sim
        if: github.event_name == 'push'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          app=$(find dist/ios-simulator -maxdepth 2 -name '*.app' -type d | head -1)
          tar -C "$(dirname "$app")" -czf DexDrop.app.tar.gz "$(basename "$app")"
          gh release view native-sim-build >/dev/null 2>&1 ||
            gh release create native-sim-build --title "native-sim builds" \
              --notes "DexDrop simulator builds for native-sim sessions, published by CI from the development branch. Safe to delete."
          for try in 1 2 3; do
            gh release upload native-sim-build DexDrop.app.tar.gz --clobber && exit 0
            sleep $((try * 20))
          done
          exit 1
      - name: Desktop app check (macOS)
        if: ${{ !cancelled() && needs.plan.outputs.checks == 'true' }}
        run: python3 scripts/desktop-check.py --require-discovery --app dist/macos/DexDrop.app --cli target/release/dexdrop --out dist/desktop-check
      - uses: actions/upload-artifact@v4
        if: always() && needs.plan.outputs.checks == 'true'
        with:
          name: desktop-check-macos
          path: dist/desktop-check
      # Drive the simulator build with agent-device: launch, walk the tabs,
      # and receive a file sent by the CLI on the same Mac (no stream, no
      # tunnel: the runner itself hosts the simulator).
      - uses: actions/setup-node@v4
        if: ${{ !cancelled() && needs.plan.outputs.checks == 'true' }}
        with:
          node-version: 22
      - uses: actions/cache@v4
        if: ${{ !cancelled() && needs.plan.outputs.checks == 'true' }}
        with:
          path: ~/.agent-device/apple-runner/derived
          key: agent-device-runner-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: agent-device-runner-${{ runner.os }}-
      - run: npm install -g agent-device@latest
        if: ${{ !cancelled() && needs.plan.outputs.checks == 'true' }}
      # The packaged macOS app through its own UI: sections, discovery, a
      # code transfer accepted in the app, and sending from the app with
      # Pause and Resume.
      - name: macOS app check (agent-device)
        timeout-minutes: 20
        if: ${{ !cancelled() && needs.plan.outputs.checks == 'true' }}
        run: scripts/macos-ui-check.sh dist/macos/DexDrop.app target/release/dexdrop dist/macos-ui
      - uses: actions/upload-artifact@v4
        if: always() && needs.plan.outputs.checks == 'true'
        with:
          name: macos-ui-check
          path: dist/macos-ui
      - name: iOS Simulator check (agent-device)
        timeout-minutes: 30
        if: ${{ !cancelled() && needs.plan.outputs.checks == 'true' }}
        run: scripts/ios-sim-check.sh dist/ios-simulator target/release/dexdrop dist/ios-screens
      - uses: actions/upload-artifact@v4
        if: always() && needs.plan.outputs.checks == 'true'
        with:
          name: ios-simulator-screens
          path: dist/ios-screens

  # NSH's runner (app/e2e) on the Mac and in the iOS simulator: the same file
  # as on every platform. A job of its own, beside packaging: `nsh test`
  # builds the app again (a debug build for NSH's development host), which
  # since NSH 0.7.0 takes longer than the steps' limits once packaging has
  # used the runner for an hour (run 91: still compiling after 25 and 30
  # minutes). Its own runner also keeps its local-network prompt away from
  # the agent-device checks, and its own cache keeps its debug builds.
  e2e-apple:
    name: App e2e (macOS, iOS simulator)
    needs: plan
    if: needs.plan.outputs.apple == 'true' && needs.plan.outputs.checks == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
      - name: Use Xcode 26
        run: |
          x=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -z "$x" ] || sudo xcode-select -s "$x/Contents/Developer"
          xcodebuild -version
      - name: Install NSH
        run: |
          curl -fsSL https://nsh.dev/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: App e2e (nsh test, macOS)
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
        timeout-minutes: 45
        run: |
          mkdir -p dist/e2e-apple
          rm -rf app/e2e-shots
          cd app && nsh test e2e/app.test.ts --target macos --junit ../dist/e2e-apple/e2e-macos.xml && status=0 || status=$?
          mkdir -p ../dist/e2e-apple/shots-macos && mv e2e-shots/* ../dist/e2e-apple/shots-macos/ 2>/dev/null || true
          exit $status
      - name: App e2e (nsh test, iOS simulator)
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
        timeout-minutes: 45
        if: ${{ !cancelled() }}
        run: |
          mkdir -p dist/e2e-apple
          rm -rf app/e2e-shots
          cd app && nsh test e2e/app.test.ts --target ios --junit ../dist/e2e-apple/e2e-ios.xml && status=0 || status=$?
          mkdir -p ../dist/e2e-apple/shots-ios && mv e2e-shots/* ../dist/e2e-apple/shots-ios/ 2>/dev/null || true
          exit $status
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-apple
          path: dist/e2e-apple
