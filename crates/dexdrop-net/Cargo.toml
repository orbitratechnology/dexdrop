[package]
name = "dexdrop-net"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Engine tests against a local Iroh relay (self-signed certificate).
test-relay = ["iroh/test-utils"]

[dependencies]
blake3 = "1.8.7"
dexdrop-core = { version = "0.1.0", path = "../dexdrop-core" }
futures-util = "0.3.34"
getrandom = "0.4.3"
if-addrs = "0.15.0"
iroh = "1.5.0"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = "1.0.229"
serde_json = "1.0.154"
socket2 = { version = "0.6.5", features = ["all"] }
spake2 = "0.4.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring"] }
tracing = "0.1.44"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["full", "test-util"] }

[target."cfg(unix)".dependencies]
libc = "0.2.191"

# Apple platforms discover through the system's Bonjour service instead,
# except the iOS Simulator (see src/discovery.rs).
[target."cfg(any(not(target_vendor = \"apple\"), all(target_os = \"ios\", target_abi = \"sim\")))".dependencies]
mdns-sd = { version = "0.22.0", features = ["async"] }

# Android reaches the system's NsdManager through JNI (the version NSH uses),
# with the Java VM and application Context NSH puts in ndk-context (which
# Iroh's DNS resolver and network watcher read too).
# Linux's direct link (src/direct/linux.rs): NetworkManager on the system
# bus, with the zbus the keyring already builds.
[target."cfg(target_os = \"linux\")".dependencies]
zbus = "5"

[target."cfg(target_os = \"android\")".dependencies]
jni = "0.21"
ndk-context = "0.1.1"

# What the packaged Android app needs for this crate's Android code; `nsh`
# adds it to every package (and to `nsh test`'s Android host) of an app that
# links this crate (https://nsh.dev/docs/nshm.md#what-the-packaged-app-needs).
[package.metadata.nsh.android]
# The Java bridges (android/dev/dexdrop, scripts/build-nsd-dex.sh): NsdManager
# discovery, the direct link (src/direct/android.rs), the installed apps (src/jvm.rs, src/apps.rs), and the foreground
# service that keeps transfers going (src/android_service.rs).
libraries = ["android/nsd.dex", "android/direct-link.aar"]
# Android 11+ shows an app only the apps it queries: the launcher apps
# Send › Apps lists (src/apps.rs).
queries = ['<intent><action android:name="android.intent.action.MAIN"/></intent>']
# The foreground service: FOREGROUND_SERVICE and its data-sync type (Android
# 14+). The in-app media browser (src/assets.rs, docs/FILE_SELECTION.md)
# reads MediaStore: the granular READ_MEDIA_* from Android 13, with
# READ_MEDIA_VISUAL_USER_SELECTED for Android 14's partial access, and
# READ_EXTERNAL_STORAGE before (ignored from 13). Google Play restricts READ_MEDIA_IMAGES
# and READ_MEDIA_VIDEO to apps whose core use needs them (docs/ARCHITECTURE.md
# ADR-008, ADR-009): sending one's photos and videos is this app's.
permissions = [
    "FOREGROUND_SERVICE",
    "FOREGROUND_SERVICE_DATA_SYNC",
    # TransferService's Wi-Fi locks while files move (no prompt).
    "WAKE_LOCK",
    # The direct link (src/direct/android.rs, docs/CONNECTIVITY.md 4.3):
    # hosting a Wi-Fi Direct group and joining a network for one transfer
    # (no prompt for these; NEARBY_WIFI_DEVICES and location up to Android
    # 12 come with their attributes from android/direct-link.aar).
    "ACCESS_WIFI_STATE",
    "CHANGE_WIFI_STATE",
    "ACCESS_NETWORK_STATE",
    "CHANGE_NETWORK_STATE",
    "READ_MEDIA_IMAGES",
    "READ_MEDIA_VIDEO",
    "READ_MEDIA_AUDIO",
    "READ_MEDIA_VISUAL_USER_SELECTED",
    "READ_EXTERNAL_STORAGE",
]
# The service the system starts (src/android_service.rs): not exported, of
# the data-sync type a file transfer is; the document picker's activity.
application = [
    '<service android:name="dev.dexdrop.TransferService" android:exported="false" android:foregroundServiceType="dataSync"/>',
    # The document picker's host (src/assets.rs): invisible, not exported.
    '<activity android:name="dev.dexdrop.PickerActivity" android:exported="false" android:theme="@android:style/Theme.Translucent.NoTitleBar" android:excludeFromRecents="true"/>',
]

[lints.rust]
# `--cfg dexdrop_check_bonjour` type-checks the Bonjour adapter elsewhere.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(dexdrop_check_bonjour)"] }
