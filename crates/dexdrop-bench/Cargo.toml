[package]
name = "dexdrop-bench"
description = "Transport benchmarks for the transport decision (PRD P0-012)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "transport-bench"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
dexdrop-core = { version = "0.1.0", path = "../dexdrop-core" }
dexdrop-net = { version = "0.1.0", path = "../dexdrop-net" }
libc = "0.2.191"
quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
tokio = { version = "1.54.1", features = ["full"] }
