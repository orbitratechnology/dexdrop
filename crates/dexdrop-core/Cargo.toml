[package]
name = "dexdrop-core"
description = "DexDrop's platform-independent core: identity, protocol, manifests, path safety, integrity, journals and invitations."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
blake3 = "1.8.7"
data-encoding = "2.11.1"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
postcard = { version = "1.2.0", features = ["use-std"] }
qrcode = { version = "0.15.0", default-features = false }
rqrr = { version = "0.11.0", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
walkdir = "2.5.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
x509-parser = "0.18.1"
rcgen = "0.14.10"
getrandom = "0.4.3"
fs4 = "1.1.0"

[dev-dependencies]
tempfile = "3.27.0"

# The identity's private key goes to the OS credential store where one is
# usable without prompts (see src/keystore.rs).
[target.'cfg(any(target_os = "windows", target_os = "linux", target_os = "ios"))'.dependencies]
keyring-core = "1"

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1"

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust"] }

[target.'cfg(target_os = "ios")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["protected"] }
