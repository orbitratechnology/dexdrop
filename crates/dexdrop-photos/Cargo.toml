[package]
name = "dexdrop-photos"
description = "iOS photo library (PhotoKit) as DexDrop's `ios-photos` asset provider: photos and videos listed a page at a time, their thumbnails, and their originals streamed to a transfer without a copy."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
dexdrop-core = { path = "../dexdrop-core" }

# PhotoKit through objc2 (no C build step, so it type-checks for iOS on any
# host: `cargo check -p dexdrop-photos --target aarch64-apple-ios`).
[target.'cfg(target_os = "ios")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "NSArray",
  "NSData",
  "NSDate",
  "NSError",
  "NSPredicate",
  "NSSortDescriptor",
  "NSString",
  "NSURL",
  "NSValue",
] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFCGTypes"] }
objc2-photos = { version = "0.3", default-features = false, features = [
  "std",
  "block2",
  "objc2-core-foundation",
  "PHAsset",
  "PHAssetResource",
  "PHAssetResourceManager",
  "PHCollection",
  "PHFetchOptions",
  "PHFetchResult",
  "PHImageManager",
  "PHObject",
  "PHPhotoLibrary",
  "PhotosTypes",
] }

# The usage text iOS shows when DexDrop asks for the library: `nsh` adds it
# to the packaged app of every app that links this crate.
[package.metadata.nsh.ios.infoPlist]
NSPhotoLibraryUsageDescription = "DexDrop lists your photos and videos on Send so you can choose several at once. They are read only when you send them."

